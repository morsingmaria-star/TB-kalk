<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>TB1-kalkyl – Konsultbokning</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Roboto', sans-serif;
  background: #FFF1E8;
  padding: 20px;
  color: #2B2B2B;
}

header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 25px;
}

header img {
  height: 45px;
}

h1 {
  margin: 0;
  color: #E94B4B;
}

.container {
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
  color: #6B1E2E;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: 500;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  border-radius: 6px;
  border: 1px solid #DDD;
}

.highlight {
  font-size: 1.9em;
  font-weight: 700;
  margin-bottom: 4px;
}

.tb-procent {
  font-size: 1.4em;
  font-weight: 700;
  margin-bottom: 10px;
}

.tb-green { color: #1E8E3E; }
.tb-yellow { color: #E6A700; }
.tb-red { color: #D93025; }

.result-row {
  margin-top: 10px;
  font-weight: 700;
}
</style>
</head>

<body>

<header>
  <img src="Dedicare_AB_red.png" alt="Dedicare">
  <h1>TB1-kalkyl – Konsultbokning</h1>
</header>

<div class="container">

  <!-- INPUT -->
  <div class="card">
    <h2>Indata</h2>

    <label>Antal veckor</label>
    <input type="number" id="veckor" value="4">

    <label>Omfattning % (100 % = 40 h)</label>
    <input type="number" id="omfattning" value="100">

    <label>Intro (timmar, ej debiterbara)</label>
    <input type="number" id="introTimmar" value="0">

    <label>Timlön (SEK)</label>
    <input type="number" id="timlon" value="300">

    <label>Anställningsform</label>
    <select id="anstForm">
      <option value="anstalld">Anställd</option>
      <option value="underkonsult">Underkonsult</option>
    </select>

    <label>Åldersprofil (endast anställd)</label>
    <select id="alder">
      <option value="u65">Under 65 år</option>
      <option value="65_67">65–67 år</option>
      <option value="68">68+ år</option>
    </select>

    <label>Debitering per timme (SEK)</label>
    <input type="number" id="debitering" value="800">

    <label>Kickback %</label>
    <input type="number" id="kickback" value="0">

    <label>Resor per vecka (SEK)</label>
    <input type="number" id="resor" value="0">

    <label>Boende per vecka (SEK)</label>
    <input type="number" id="boende" value="0">
  </div>

  <!-- RESULTAT -->
  <div class="card">
    <h2>Resultat</h2>

    <div id="tbTotal" class="highlight">TB1 totalt: 0 SEK</div>
    <div id="tbProcent" class="tb-procent">TB %: 0 %</div>

    <div class="result-row" id="perVecka"></div>
    <div class="result-row" id="perManad"></div>
  </div>

</div>

<script>
function berakna() {
  const veckor = +veckorEl.value;
  const omfattning = +omfattningEl.value / 100;
  const introTimmar = +introEl.value;
  const timlon = +timlonEl.value;
  const debitering = +debEl.value;
  const kickback = +kickEl.value / 100;
  const resor = +resorEl.value;
  const boende = +boendeEl.value;
  const alder = alderEl.value;
  const anstForm = anstFormEl.value;

  const timmarPerVecka = 40 * omfattning;
  const totalaTimmar = timmarPerVecka * veckor;
  const debiterbaraTimmar = Math.max(0, totalaTimmar - introTimmar);

  let agLon = 0;
  let agRB = 0;

  if (anstForm === "anstalld") {
    if (alder === "u65") { agLon = 0.6027; agRB = 0.3142; }
    if (alder === "65_67") { agLon = 0.4777; agRB = 0.3142; }
    if (alder === "68") { agLon = 0.24; agRB = 0.1021; }
  }

  const intakt = debiterbaraTimmar * debitering * (1 - kickback);
  const lonKostnad = totalaTimmar * timlon * (1 + agLon);
  const rbKostnad = veckor * (resor + boende) * (1 + agRB);

  const totalKostnad = lonKostnad + rbKostnad;
  const tbTotal = intakt - totalKostnad;
  const tbProcent = intakt > 0 ? tbTotal / intakt : 0;

  tbTotalEl.innerText = "TB1 totalt: " + Math.round(tbTotal) + " SEK";
  tbProcentEl.innerText = "TB %: " + (tbProcent * 100).toFixed(1) + " %";

  const färg =
    tbProcent > 0.10 ? "tb-green" :
    tbProcent >= 0 ? "tb-yellow" : "tb-red";

  tbTotalEl.className = "highlight " + färg;
  tbProcentEl.className = "tb-procent " + färg;

  perVeckaEl.innerText =
    "Per vecka – Intäkt: " + Math.round(intakt / veckor) +
    " | Kostnad: " + Math.round(totalKostnad / veckor) +
    " | TB: " + Math.round(tbTotal / veckor) + " SEK";

  perManadEl.innerText =
    "Per månad – Intäkt: " + Math.round(intakt / veckor * 4.175) +
    " | Kostnad: " + Math.round(totalKostnad / veckor * 4.175) +
    " | TB: " + Math.round(tbTotal / veckor * 4.175) + " SEK";
}

const veckorEl = document.getElementById("veckor");
const omfattningEl = document.getElementById("omfattning");
const introEl = document.getElementById("introTimmar");
const timlonEl = document.getElementById("timlon");
const debEl = document.getElementById("debitering");
const kickEl = document.getElementById("kickback");
const resorEl = document.getElementById("resor");
const boendeEl = document.getElementById("boende");
const alderEl = document.getElementById("alder");
const anstFormEl = document.getElementById("anstForm");

const tbTotalEl = document.getElementById("tbTotal");
const tbProcentEl = document.getElementById("tbProcent");
const perVeckaEl = document.getElementById("perVecka");
const perManadEl = document.getElementById("perManad");

document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", berakna)
);

berakna();
</script>

</body>
</html>
